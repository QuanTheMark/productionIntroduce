<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person" />
    <link rel="stylesheet" href="/css/colorRoot.css">
</head>

<style>

    .material-symbols-outlined {
    font-variation-settings:
    'FILL' 0,
    'wght' 400,
    'GRAD' 0,
    'opsz' 24;
    transform: scale(1.5);
    }

    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        width: 100%;
        height: 100vh;
        min-height: 100dvh;
        background-color: var(--white-color);
    }

    .menuBar{
        width: 100%;
        height: 100px;
        background-color: var(--white-color);
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        position: sticky;
        top: 0;

        a{
        text-decoration: none;
        color: black;
        font-size: 1.2rem;
        }

    }

    .logo{
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: 600;
    }

    .logo .logo_image{
        background-image: url("/resources/LogoPage.jpeg");
        background-size: contain;
        background-repeat: no-repeat;
        min-width: 150px;
        min-height: 100px;
    }

    .toolBar{
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .userPanel{
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
    }
   
    .userPanel_image{
        background-color: var(--white-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-width: 50px;
        min-height: 50px;
        border-radius: 30px;
       
        
    }

    .userPanel_image.active{
        background-size: contain;
        background-repeat: no-repeat;
        min-width: 50px;
        min-height: 50px;
        border-radius: 30px;
    }

    .current{
        width: 100%;
        height: 5px;
        background-color: var(--success-color);
        border-radius: 20px;
        opacity: 0;
        transform: scaleX(0);
    }

    .current.active{
        opacity: 1;
        transform: scaleX(1);
        transition: all 0.3s ease-in-out;
    }

    .setting{
        position: relative;
    }

    .dropdown-content{
        width: 100%;
        height: 30px;
        position: absolute;
        opacity: 0;
        visibility: hidden;
        top: 100%;
    }

    .dropdown-content button{
        cursor: pointer;
        width: 100%;
        height: 100%;
        background-color: var(--danger-color);
        text-align: center;
        color: var(--white-color);
        border: none;
        border-radius: 20px;
        font-size: .8rem;
        font-weight: 600;

    }

    .setting:hover .dropdown-content {
    opacity: 1;
    visibility: visible;

    
}


@media screen and ( width <= 442px){
    .menuBar{
       display: flex;
       justify-content: space-around;
       align-items: center;
    }

    .toolBar{
        display: none;
    }

    .userPanel_mobile{
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 10px;
        margin-top: 20px;

    }
    .userPanel_image{
        background-color: var(--white-color);
        width: 50px;
        height: 50px;
        border-radius: 30px;
       
        
    }

    .userPanel_image.active{
    display: flex;
    justify-content: center;
    align-items: center;
       
        
    }

    .menuBtn{
    background-image: url("/resources/menu.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-color: black;
    width: 50px;
    height: 50px;
    }

    .sideBar{
        height: 100vh;
        width: 250px;
        background-color: var(--white-color);
        position: fixed;
        top: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        padding: 5px;
        opacity: 0;
        transform: translateX(100%);
        transition: all 0.3s ease-in-out;
    }
    
    .mobileLogout{
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: auto;

    }

    .sideBar button{
        background-color: var(--danger-color);
        color: var(--white-color);
        width: 90%;
        height: 50px;
        border-radius: 20px;
        font-size: 1.2rem;
        font-weight: 600;
    }

    .menuClose{
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        width: 50px;
        height: 50px;
        background-image: url("/resources/close.png");
        background-size: contain;
        background-repeat: no-repeat;
        background-color: var(--danger-color);
    }

    ul{
        width: 100%;
        line-height: 3;

    }

    ul li{
        list-style: none;
        font-size: 1.2rem;
        font-weight: 600;
        border-bottom: black 2px solid;
    
    }

    .logo{
        font-size: 1.5rem;
        justify-content: space-between;
    }

    .logo .logo_image{
        min-width: 75px;
        min-height: 50px;
    }   

}


</style>

<body>
    <header>
        <section class  = "menuBar">
            <div class = "logo">
                <div class = "logo_image"></div>
                <span><b>Abydas</b></span>
            </div>
            <div class = "toolBar">
                <div>
                    <a href="#">Home</a>
                    <div class = "current"></div>
                </div>
                <div>
                <a href="#">About</a>
                <div class = "current"></div>
                 </div>

                <div>
                    <a href="#">Production</a>
                    <div class = "current"></div>
                </div>

                <div>
                    <a href="#">Contact</a>
                    <div class = "current"></div>
                </div>
            </div>
            <div class = "userPanel"></div>
        </section>
    </header>
    <main></main>
    <footer></footer>
</body>
<script>

    
    const pages = document.querySelectorAll(".toolBar a");
    pages.forEach(page => {
        page.addEventListener("click", (event) =>{
            pages.forEach(p => {
                p.nextElementSibling.classList.remove("active");
            })

            event.target.nextElementSibling.classList.add("active");

        });

    });

    let deviceWidth = window.innerWidth > 442;
    renderLayout();
   
    window.addEventListener('resize', function(){
        const currentWidth = window.innerWidth > 442;
        if(deviceWidth != currentWidth){
            deviceWidth = currentWidth;
            renderLayout();
        }
    })







































 function renderLayout(){
    const homePage = document.querySelector('.userPanel');
    const userActive  = JSON.parse(localStorage.getItem('userActive'));
  

    if(deviceWidth){
    if(userActive != null ) {
        homePage.innerHTML = 
        ` <div class = "userPanel_image active"></div>
                <div class = "setting">
                    <a href = "#"><h3>${userActive.username}</h3></a>
                    <div class = "dropdown-content">
                    <button class = "logOutBtn">Logout</button>
                    </div>
                </div>`
        
        const userImg = document.querySelector('.userPanel_image');
        userImg.style.backgroundImage = `url('https://ui-avatars.com/api/?name=${encodeURIComponent(userActive.username)}&background=random')`;
        const userLogout = document.querySelector('.logOutBtn');
        userLogout.onclick = function(){
            localStorage.removeItem('userActive');
            window.location.reload();
        }
        

    }else{
            homePage.innerHTML = 
            `
            <div class = "userPanel_image">
                    <span class="material-symbols-outlined">person</span>
                </div>
                <div class ="registerBtn">
                    <a href="./register.html">Register</a>
                </div>
                <div class ="loginBtn">
                    <a href="./login.html">Login</a>
            </div>
            `
        }
}else{
    if(userActive != null){
        homePage.innerHTML = 
    `   <div class = "menuBtn"></div>
        <div class = "sideBar">
            <div class = "menuClose"></div>
            <div class = "userPanel_mobile">
                <div class = "userPanel_image active"></div>
                <ul>
                <li><a href = "#">Home</a></li>    
                <li><a href = "#">About</a></li>
                <li><a href = "#">Production</a></li>  
                <li><a href = "#">Contact</a></li>     
                </ul>
            </div>
            <div class = "mobileLogout">
                <button class = "logOutBtn">Logout</button>
            </div>
        </div>
    `;

        const userImg = document.querySelector('.userPanel_image');
        userImg.style.backgroundImage = `url('https://ui-avatars.com/api/?name=${encodeURIComponent(userActive.username)}&background=random')`;
        const userLogout = document.querySelector('.logOutBtn');
        userLogout.onclick = function(){
            localStorage.removeItem('userActive');
            window.location.reload();
        }
    }
    else{
        homePage.innerHTML = 
    `   <div class = "menuBtn"></div>
        <div class = "sideBar">
            <div class = "menuClose"></div>
            <div class = "userPanel_mobile">
                <div class = "userPanel_image">
                        <span class="material-symbols-outlined">person</span>
                </div>
                <ul>
                <li><a href = "./register.html">Register</a></li>    
                <li><a href = "./login.html">Login</a></li>   
                </ul>
            </div>
        </div>
    `;
    }
    

    const sideBar = document.querySelector('.sideBar');
    const menuBtn = document.querySelector('.menuBtn');
    const menuClose = document.querySelector('.menuClose');
    menuBtn.onclick = function(){
        sideBar.style.opacity = "1";
        sideBar.style.transform = "translateX(0)";
    }
    
    menuClose.onclick = function(){
        sideBar.style.opacity = "0";
        sideBar.style.transform = "translateX(100%)";
    }
}
    }
</script>
</html>
