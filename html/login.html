<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person" />
    <link rel="stylesheet" href="../css/inputRoot.css">
</head>
<style>
    
    .sign-up{
        margin-top: 20px ;
        display: flex;
        justify-content: center;
        align-items: center;
    }
</style>

<body>
     <div class = "wrapper">
        <div><h2>Đăng nhập</h2></div>
        <form class = "form-control">
            <div class = "input-control">
                <label for="username">Tên đăng nhập</label>
                <input type="text" name = "username" id = "username" 
                placeholder = "Tên đăng nhập" required>
            </div>
            <div class = "input-control">
                <label for="password">Mật khẩu</label>
                <input type="password" name = "password" id = "password" 
                placeholder = "Mật khẩu" required>
            </div>
            <div class = "button-control">
                <button class = "confirmBtn" type="button">Đăng nhập</button>
            </div>
        </form>
        <div class = "sign-up">
            <a href="./register.html">Không có tài khoản? Đăng ký ngay</a>
        </div>
    </div>
</body>
<script src="/js/login.js" defer></script>
</html>
