<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person,star" />
    <link rel="stylesheet" href="./src/css/default.css">
    <link rel="stylesheet" href="./src/css/menuBar.css">
    <link rel="stylesheet" href="./src/css/homeHeader.css">
   
</head>

<style>
    main{
        overflow: hidden;
    }
    .btn-customs{
        width: 200px;
        height: 40px;
        margin-top: 20px;
        border-radius: 5px;
        background-color: var(--black-color);
        color: var(--white-color);
        border: none;
        cursor: pointer;
    }


    .brands{
        width: 100%;
        height: 75px;
        background-color: var(--gray-color) ;
        display: flex;
        justify-content: space-around;
        align-items: center;
        font-size: 1.2rem;
        font-weight: 600;
        a{
            text-decoration: none;
            color: var(--black-color);
        }
    }

    .onSaleProduction{
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 50px;
    }

    .onSaleProduction_text{
        text-align: center;
        p{  
            width: 500px;
            color: var(--gray-color);
            opacity: 0.8;
        }
    }

    .referentialProduction{
        margin-top: 20px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        width: 100%;
    }

    .referentialProduction_container{
        width: 300px;
        height: 300px;
        border: black 2px solid;
        border-radius: 20px ;
        padding: 10px;
        .price{
            color: var(--danger-color);
        }

        .title{
            width: 150px;
        }


    }

    .production1{
        background-image: url("./src/resources/top1.png");
        background-size: contain;
        background-repeat: no-repeat;
    }
    
    .containerBtn{
        width: 100px;
        border-radius: 5px;
        border: none;

    }

      .production2{
        background-image: url("./src/resources/top2.png");
        background-size: contain;
        background-repeat: no-repeat;
    }

      .production3{
        background-image: url("./src/resources/top3.png");
        background-size: contain;
        background-repeat: no-repeat;
    }

    .banners{
        display: flex;
        justify-content: space-around;
        align-items: center;
        gap: 20px;
    }

    .productionReview{
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 50px;
        padding: 5px;
    }

    .productionReview_text{
        text-align: center;
        p{  
            width: 500px;
            color: var(--gray-color);
            opacity: 0.8;
        }
    }

    .productEvaluation{
        width: 100%;
        display: flex;
        justify-content: space-around;
        align-items: center;
        gap: 50px;
    }

    .productEvaluation_container{
        width: 400px;
        height: 300px;
        background-color: aliceblue;
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 20px;
        padding: 5px;
        margin-top: 50px;
        
        
    }

    .productEvaluation_container.middle{
        background-color: var(--secondary-black-color);
        opacity: 1;
        transform: scale(110%);
    }
    .container_productionImage{
        background-image: url("./src/resources/feedback1.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

    }
    
    .container_reviewer{
        padding: 5px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .reviewer_feedback{
        border-bottom: var(--black-color) 3px solid;
    }

    .btnRight, .btnLeft{
        background-color: var(--black-color);
        opacity: 0.9;
        width: 60px;
        height: 50px;
        border-radius: 30px;
        border: none;
        cursor: pointer;
        color: var(--white-color);
    }

    .btnLeft{
        background-image: url("./src/resources/btnArrow.png");
        background-position: center;
        background-size: contain;
        background-repeat: no-repeat;
    }

    .btnRight{
        background-image: url("./src/resources/btnArrowForward.png");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
    }

     .plate{
            width: 50px;
            height: 50px;
            border-radius: 30px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
        }


        .nike{
            background-image: url("src/resources/nike.png");
     
       
        }
        .adidas{
            background-image: url("src/resources/addias.png");

       
        }

        .puma{
            background-image: url("src/resources/pum.png");
    
       
        }

        .newBalance{
            background-image: url("src/resources/new\ Balance.png");

   
        }

        .asics{
            background-image: url("src/resources/acis.png");


        }
        .bitis{
            background-image: url("src/resources/bitis.png");
 
        }
        .ananas{
            background-image: url("src/resources/ananas.png");


        }

        .footer{
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--secondary-gray-color);
            margin-top: 20px;
          
        }

        .term{
            display: flex;
            gap: 20px;
        }

        .term div{
            border-right: var(--black-color) 2px solid;
        }
       


</style>

<body>

    <section class  = "menuBar">
            <div class = "logo">
                <div class = "logo_image"></div>
                <span><b>Abydas</b></span>
            </div>
            <div class = "toolBar">
                <div>
                    <a href="index.html">Trang chủ</a>
              
                </div>
                <div>
                    <a href="production.html">Sản phẩm</a>
    
                 </div>

                <div>
                    <a href="#">Liên hệ</a>

                </div>

                <div>
                    <a href="#">Về chúng tôi</a>

                </div>
            </div>
            <div class = "userPanel"></div>
    </section>  
    <header>
        <section class = "explore">
            <div class ="explore_text">
                <h2>Định Hình Phong Cách,Bứt Phá Giới Hạn</h2>
                <p>Đột phá thiết kế, nâng tầm từng bước chuyển động, khám phá BST giày sneakers cá tính nhất mùa này.</p>
            </div>
            <button class ="explore_btnExplore btn-customs">Khám phá ngay</button>
        </section>
    </header>
    <main id="main"></main>
    <footer id ="footer"></footer>
</body>
<script src="./src/js/pageRender.js" defer></script>
<script src="./src/js/explore.js"></script>
</html>
