<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person,star" />
    <link rel="stylesheet" href="./src/css/default.css">
    <link rel="stylesheet" href="./src/css/menuBar.css">
</head>

    <style>
        .container{

            padding: 10px;
            width: 100%;
            display: flex;
            align-items: stretch;

     
        }

        .sidebar{
            position: sticky;
            width: 300px;
            left: 0;
            top: 100px;
            height: calc(100% - 100px);
            background-color: var(--secondary-gray-color);
            padding: 10px 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex-shrink: 0;

        }

        .box-text{
            width: 400px;
            height: 200px;
            font-size: 1.5rem;
            padding: 50px 0;

        }

        .content{
            display: flex;
            flex-direction: column;
     
        }

        header{
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-image: url("src/resources/productionHeader.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            width: 100%;
            height: 400px;
            padding: 20px;
            .text{
                color: var(--gray-color);
                opacity: 0.8;
            }
        }

        .iconics{
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
            height: 100px;
            gap: 20px;
            margin-top: auto;
        }

        .plate{
            width: 50px;
            height: 50px;
            border-radius: 30px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
        }


        .nike{
            background-image: url("src/resources/nike.png");
     
       
        }
        .adidas{
            background-image: url("src/resources/addias.png");

       
        }

        .puma{
            background-image: url("src/resources/pum.png");
    
       
        }

        .newBalance{
            background-image: url("src/resources/new\ Balance.png");

   
        }

        .asics{
            background-image: url("src/resources/acis.png");


        }
        .bitis{
            background-image: url("src/resources/bitis.png");
 
        }
        .ananas{
            background-image: url("src/resources/ananas.png");


        }
        .filter{
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .filter_icon{
            background-image: url("src/resources/filter.png");
            background-size: contain;
            background-repeat: no-repeat;
            width: 30px;
            height: 30px;
        }

        .toolBox{
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
            gap: 20px;
            
        button{
            border-bottom: var(--black-color) 2px solid;
        }
             
        }

        button{
            border: none;
            background-color: transparent;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: 600;
        }

        .listBox{
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 1.2rem;
            gap: 20px;
            margin-top: 50px;

        }

        .searchBtn{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            width: 200px;
            border-radius: 5px;

            button{
                height: 50px;
            }
        }

        .title{
            font-size: 1.5rem;
            font-weight: 1000;
        }
        .genderBox{
            display: flex;
            flex-direction: column;
            margin-top: 50px;
            gap: 30px;

            label{
                font-size: 1.3rem;
            }
        }

        .genderChoice{
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .genderBox input{
            width:  25px;
            height: 25px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .genderBox .inputGender{
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .sortBox{
            margin-top: 50px;
        }

        .priceSelector{
            display: flex;
            flex-direction: column;
            margin-top: 20px;
        }

        .priceTopic{
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: 200px;
            height: 50px;
            gap: 20px;
        }

        .result{
            margin-top: 0px;
            background-color: var(--black-color);
            color: var(--white-color);
            border-radius: 5px;
            width: 200px;
            height: 50px;
            margin-top: 30px;
        }

        main{
             min-height: 500px; 
        }

        .boxWrapper{
            display: grid;
            grid-template-columns: 200px 200px 200px;
            grid-column-gap: 100px;
            grid-row-gap: 100px;
            margin-left: 150px;
        }

        .boxContent{
            width: 200px;
            height: 300px;
            border: var(--black-color) 1px solid;
            border-radius: 10px;
       
        }

        .footer{
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: var(--secondary-gray-color);
            margin-top: 20px;
          
        }

        .term{
            display: flex;
            gap: 20px;
        }

        .term div{
            border-right: var(--black-color) 2px solid;
        }
    </style>

<body>
    <section class  = "menuBar">

            <div class = "logo">
                <div class = "logo_image"></div>
                <span><b>Abydas</b></span>
            </div>
            <div class = "toolBar">
                <div>
                    <a href="index.html">Trang chủ</a>
              
                </div>
                <div>
                <a href="production.html">Sản phẩm</a>
    
                 </div>

                <div>
                    <a href="#">Liên hệ</a>

                </div>

                <div>
                    <a href="#">Về chúng tôi</a>

                </div>
            </div>
            <div class = "userPanel"></div>
    </section>

    <div class = "container">
        <aside class ="sidebar">
            <div class = "toolBox">
                <div class = "filter">
                <span class ="filter_icon"></span>
                <h3>Bộ lọc</h3>
                </div>
               

                <button>Xóa tất cả</button>
            </div>
            <div class = "listBox">
                <h3 class="title">Thương hiệu</h3>
                <div class ="searchBtn">
                <button>Tất cả</button>
                <button>Nike</button>
                <button>Adidas</button>
                <button>Puma</button>
                <button>New balance</button>
                <button>Asics</button>
                <button>Biti<sub>'</sub>s</button>
                <button>Ananas</button>
                </div>
            </div>
            <div class = "genderBox">
                <h3 class = "title">Giới tính</h3>
                <div class = "genderChoice">
                <div class ="inputGender"><input type="checkbox" name = "gender" id = "male"><span><label  for="male">Nam</label></span></div>
                <div class = "inputGender"><input type="checkbox" name = "gender" id = "female"><span><label  for="female">Nữ</label></span></div>
                </div>
            </div>
            <div class = "sortBox">
                <h3 class="title">Sắp xếp</h3>
                <div class = "priceSelector">
                    <div class ="priceTopic"><input type="radio" name = "price" id = "new"><span><label  for="new">Mới nhất</label></span></div>
                    <div class = "priceTopic"><input type="radio" name = "price" id = "onSale"><span><label  for="onSale">Bán chạy</label></span></div>
                    <div class ="priceTopic"><input type="radio" name = "price" id  = "lowToHigh"><span><label  for="lowToHigh">Giá: Thấp đến cao</label></span></div>
                    <div class = "priceTopic"><input type="radio" name = "price" id = "highToLow"><span><label  for="highToLow">Giá: Cao đến thấp</label></span></div>

                </div>
            </div>
            <button class = "result">Xem kết quả</button>
        </aside>
        <section class ="content">
            <header>
                <div class = "box-text">
                    <h2 class="title">KHÁM PHÁ BỘ SƯU TẬP</h2>
                    <p  class="text">Hơn 50+ mẫu Sneaker chính hãng từ 7 thương hiệu hàng đầu. </p>
                </div>
                
                <div class="iconics">
                    <div class = "plate nike"></div>
                    <div class = "plate adidas"></div>
                    <div class = "plate puma"></div>
                    <div class = "plate newBalance"></div>
                    <div class = "plate asics"></div>
                    <div class = "plate bitis"></div>
                    <div class = "plate ananas"></div>
                </div>
            </header>
            <main>
                <section class = "boxWrapper">
                <div class = "boxContent"></div>
                <div class = "boxContent"></div>
                <div class = "boxContent"></div>
                <div class = "boxContent"></div>
                <div class = "boxContent"></div>
                <div class = "boxContent"></div>
                <div class = "boxContent"></div>
                <div class = "boxContent"></div>
                <div class = "boxContent"></div>
                </section>
            </main>
            <footer>
            </footer>
        </section>
    </div>

    <section class = "footer">
          <div class = "logo">
                    <div class ="logo_image"></div>
                    <h2>Abydas</h2>
                </div>

                <div>
                    <p>Copyright &copy; 2026 <b>Abydas</b>. All rights reserved.</p>
                </div>

                <div class ="term">
                    <a href="#">Chính sách bảo mật</a>
                    <div></div>
                    <a href="#">Điều khoản sử dụng</a>
            </div>
    </section>
</body>

<script src="./src/js/pageRender.js"></script>
</html>
